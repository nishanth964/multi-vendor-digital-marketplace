{% extends 'myapp/base.html' %} {% block body %}
<div class="max-w-3xl mx-auto px-6 py-12">
  <a href="{% url 'myapp:index' %}" class="text-indigo-600 hover:underline">
    ← Back to products
  </a>

  <div class="mt-6 bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
    <div
      class="h-40 rounded-xl bg-indigo-50 flex items-center justify-center mb-8"
    >
      <span class="text-indigo-600 font-semibold text-lg">
        Digital Product
      </span>
    </div>

    <h1 class="text-3xl font-bold text-gray-900">{{ product.name }}</h1>

    <p class="mt-4 text-gray-600 leading-7">{{ product.description }}</p>

    <div class="mt-6 border-t border-gray-100 pt-6">
      <p class="text-sm text-gray-500">Price</p>

      <p class="mt-1 text-3xl font-bold text-indigo-600">
        ₹{{ product.price }}
      </p>
    </div>

    <button
      type="button"
      class="mt-8 w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200"
    >
      Buy Now
    </button>
  </div>
</div>
{% endblock %}
