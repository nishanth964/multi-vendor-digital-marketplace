<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Digital Marketplace</title>
  </head>

  <body>
    <nav class="shadow-lg bg-white">
      <div class="flex flex-wrap justify-between items-center mx-auto p-4">
        <!-- Logo -->
        <a href="{% url 'myapp:index' %}" class="flex items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-9 w-9 mr-3 text-indigo-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"
            />
            <circle cx="10" cy="20" r="1" />
            <circle cx="18" cy="20" r="1" />
          </svg>

          <span class="self-center text-xl font-semibold whitespace-nowrap">
            Digital Marketplace
          </span>
        </a>

        <!-- Navigation links -->
        <div class="flex items-center">
          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Dashboard
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Sales
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Orders
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Create Product
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            My Products
          </a>

          <a
            href=""
            class="text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Login
          </a>
        </div>
      </div>
    </nav>
    {% block body %} {% endblock %}
  </body>
</html>
