<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Digital Marketplace</title>
  </head>

  <body>
    <nav class="shadow-lg bg-white">
      <div class="flex flex-wrap justify-between items-center mx-auto p-4">
        <!-- Logo -->
        <a href="" class="flex items-center">
          <img
            class="h-9 mr-3"
            src="https://static.djangoproject.com/img/logos/django-logo-negative.svg"
            alt="Django Logo"
          />
          <span class="self-center text-xl font-semibold whitespace-nowrap">
            Digital Marketplace
          </span>
        </a>

        <!-- Navigation links -->
        <div class="flex items-center">
          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Dashboard
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Sales
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Orders
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Create Product
          </a>

          <a
            href=""
            class="mr-6 text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            My Products
          </a>

          <a
            href=""
            class="text-sm font-medium text-gray-500 hover:text-blue-600"
          >
            Login
          </a>
        </div>
      </div>
    </nav>
    {% block body %} {% endblock %}
  </body>
</html>
