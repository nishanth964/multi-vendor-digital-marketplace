{% extends 'myapp/base.html' %}

{% block body %}
<div class="min-h-screen bg-gray-50 px-6 py-12">
    <div class="max-w-2xl mx-auto">

        <div class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">
                Seller Dashboard
            </p>
            <h1 class="text-3xl font-bold text-gray-900 mt-2">
                Create a Product
            </h1>
            <p class="text-gray-500 mt-2">
                Add your digital product to the marketplace.
            </p>
        </div>

        <form method="POST" enctype="multipart/form-data"
              class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm space-y-6">

            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                       for="{{ product_form.name.id_for_label }}">
                    Product Name
                </label>
                <input type="text" name="name" id="{{ product_form.name.id_for_label }}"
                       value="{{ product_form.name.value|default:'' }}"
                       maxlength="50" required
                       class="w-full border border-gray-300 rounded-xl bg-white px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                {{ product_form.name.errors }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                       for="{{ product_form.description.id_for_label }}">
                    Description
                </label>
                <textarea name="description" id="{{ product_form.description.id_for_label }}"
                          rows="4" maxlength="200" required
                          class="w-full border border-gray-300 rounded-xl bg-white px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ product_form.description.value|default:'' }}</textarea>
                {{ product_form.description.errors }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                       for="{{ product_form.price.id_for_label }}">
                    Price (₹)
                </label>
                <input type="number" name="price" id="{{ product_form.price.id_for_label }}"
                       value="{{ product_form.price.value|default:'' }}"
                       min="0" step="0.01" required
                       class="w-full border border-gray-300 rounded-xl bg-white px-4 py-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                {{ product_form.price.errors }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2"
                       for="{{ product_form.file.id_for_label }}">
                    Digital Product File
                </label>
                <input type="file" name="file" id="{{ product_form.file.id_for_label }}"
                       required
                       class="block w-full border border-gray-300 rounded-xl bg-white p-3 text-sm text-gray-700 file:mr-4 file:border-0 file:rounded-lg file:bg-indigo-600 file:px-4 file:py-2 file:text-white hover:file:bg-indigo-700">
                {{ product_form.file.errors }}
            </div>

            <button type="submit"
                    class="w-full rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200">
                Create Product
            </button>

        </form>
    </div>
</div>
{% endblock %}
